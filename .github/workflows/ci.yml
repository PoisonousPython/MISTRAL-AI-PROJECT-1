name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Package
        shell: pwsh
        run: |
          $stage = "package\thermal-governor"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build\governor.dll $stage\
          Copy-Item build\governor_injector.exe $stage\
          Copy-Item dist\* $stage\
          Copy-Item config\thermal_governor.ini $stage\
          Compress-Archive -Path package\thermal-governor -DestinationPath thermal-governor-win64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: thermal-governor-win64
          path: thermal-governor-win64.zip
      - name: Verify artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path build\governor.dll)) { throw "governor.dll missing" }
          if (-not (Test-Path build\governor_injector.exe)) { throw "governor_injector.exe missing" }
          if (-not (Test-Path thermal-governor-win64.zip)) { throw "zip missing" }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [linux-tests, windows-build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: thermal-governor-win64
      - name: Create GitHub release with the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" thermal-governor-win64.zip --title "Thermal Governor ${{ github.ref_name }}" --notes "Unzip, double-click 'Launch Governor.bat'. Single-player games only - DLL injection can trigger anti-cheat systems."
