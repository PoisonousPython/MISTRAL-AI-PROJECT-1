name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC x64)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Verify artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path build\Release\governor.dll)) { throw "governor.dll missing" }
          if (-not (Test-Path build\Release\governor_injector.exe)) { throw "governor_injector.exe missing" }
