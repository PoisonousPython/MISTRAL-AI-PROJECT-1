[governor]
enabled = true

[cpu]
; Hard cap on total CPU usage of the whole game process.
; Units: permille of ALL logical cores combined (7500 = 75%, 5000 = 50%).
; Requires Windows 8+. 0 = no cap.
cpu_rate_permille = 7500

; Explicit affinity mask (hex) for every game thread. Examples:
;   0        = leave mask alone
;   0x00FF   = use only the first 8 logical processors
; affinity_mask wins over reserve_cores below.
; PS3-style "reserve idle cores" example: reserve_cores = 2
reserve_cores = 0

; Priority class for the whole process: normal | below_normal | idle | high
priority_class = below_normal

; Re-apply the mask every thread_sweep_ms so threads the game spawns later
; inherit your placement too.
apply_to_new_threads = true
thread_sweep_ms = 250

[memory]
; Job-object commit limit in MB. 0 = unlimited.
commit_limit_mb = 0

[framerate]
; FPS caps per API. 0 disables that API's cap.
; fps_limit is the fallback used when a per-API value is 0.
fps_limit = 60
fps_d3d9 = 0
fps_dxgi = 0
fps_vulkan = 0
fps_opengl = 0

[present]
; Force the swap-interval (vsync) on DXGI presents (D3D10/11/12):
; -1 = leave the game's choice, 0 = force off, 1..4 = force vsync.
dxgi_force_sync_interval = -1

[pacing]
; Busy-spin window used for precise frame pacing (ms). Larger = more precise,
; slightly more CPU. Keep <= 4.
spin_guard_ms = 2

[power]
; Optional power plan switch at governor start (admin required).
; balanced | high | ultimate | saver | {GUID}
plan =

[vulkan]
; Static-import hooks work for most Win32 Vulkan games. Titles that resolve
; everything through vkGetInstanceProcAddr need governor.dll registered as a
; Vulkan layer - see README. pace_point: queue_present | queue_submit
layer = false
pace_point = queue_present
